<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SD Karaoke | TV Display</title>

    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1736'/%3E%3Ctext x='50' y='64' fill='%23edf2ff' font-family='Arial,sans-serif' font-size='35' font-weight='700' text-anchor='middle'%3ESD%3C/text%3E%3C/svg%3E"
      type="image/svg+xml"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="karaoke-sessions.js"></script>

    <!-- YouTube API - Deferred loading for faster initial render -->
    <script>
      window.onYouTubeIframeAPIReady = function () {
        console.log("✅ YouTube API ready");
        window.ytReady = true;
        if (window.createYouTubePlayer) createYouTubePlayer();
        if (window.checkBootupCompletion) checkBootupCompletion();
      };
    </script>
    <script async defer src="https://www.youtube.com/iframe_api"></script>

    <!-- QRCode - Deferred loading -->
    <script
      async
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    ></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        background: linear-gradient(
          135deg,
          #0f0f1e 0%,
          #1a0a2e 50%,
          #0f0f1e 100%
        );
        font-family: "Roboto", sans-serif;
        overflow: hidden;
        color: white;
      }

      /* TV Container */
      .tv-container {
        display: flex;
        flex-direction: column;
        height: 100vh;
        width: 100vw;
        padding: 40px;
        position: relative;
      }

      .tv-container.fullscreen-active {
        position: fixed;
        inset: 0;
        z-index: 9998;
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        padding: 0;
        background: #000;
      }

      .tv-container.fullscreen-active
        > :not(.now-playing-section):not(#exitFullscreenBtn) {
        display: none !important;
      }

      .tv-container.fullscreen-active .now-playing-section {
        width: 100%;
        height: 100%;
        min-height: 0;
      }

      .tv-container.fullscreen-active .now-playing-card {
        border-radius: 0;
        box-shadow: none;
      }

      .tv-container.fullscreen-active #noSongMessage,
      .tv-container.fullscreen-active #centerSingerName {
        display: none !important;
      }

      #exitFullscreenBtn[hidden] {
        display: none;
      }

      #exitFullscreenBtn:not([hidden]) {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10001;
        min-height: 44px;
        padding: 8px 12px;
        border: 0;
        border-radius: 8px;
        background: rgba(20, 20, 20, 0.8);
        color: #fff;
        font-size: 0.9rem;
        cursor: pointer;
      }

      body.fullscreen-ui-active {
        overflow: hidden;
      }

      body.fullscreen-ui-active > :not(.tv-container):not(script):not(link) {
        display: none !important;
      }

      /* Video Player / Now Playing */
      .now-playing-section {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        width: 100%;
        height: 100%;
      }

      .now-playing-card {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        background: #000;
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      }

      /* Video */
      #videoPlayer {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #noSongMessage {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #080808;
        color: white;
        text-align: center;
      }

      #noSongMessage strong {
        font-size: clamp(1.5rem, 4vw, 3rem);
      }

      #noSongMessage span {
        color: rgba(255, 255, 255, 0.7);
        font-size: clamp(0.95rem, 2vw, 1.25rem);
      }

      /* Next Song Display (Top Left) */
      #nextSongDisplay {
        position: fixed;
        top: 30px;
        left: 30px;
        background: rgba(30, 30, 50, 0.85);
        backdrop-filter: blur(6px);
        padding: 12px 20px;
        border-radius: 20px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        min-width: 300px;
      }

      #nextSongDisplay span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Fullscreen & Clear Queue Buttons (Top Right) */
      .button-group {
        position: fixed;
        top: 30px;
        right: 30px;
        display: flex;
        gap: 12px;
        z-index: 100;
      }

      .button-group button {
        padding: 12px 20px;
        border-radius: 50px;
        font-weight: 600;
        cursor: pointer;
        font-size: 1rem;
        border: none;
        color: white;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
      }

      .active-room-display {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 190px;
        min-height: 52px;
        padding: 7px 12px;
        border: 1px solid rgba(255, 255, 255, 0.45);
        border-radius: 8px;
        background: #191927;
        color: white;
        line-height: 1.3;
      }

      .active-room-display span {
        color: rgba(255, 255, 255, 0.62);
        font-size: 0.7rem;
      }

      .active-room-display strong {
        overflow: hidden;
        font-size: 0.9rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .active-room-display small {
        color: rgba(255, 255, 255, 0.72);
        font-size: 0.65rem;
      }

      #fullscreenBtn {
        background: linear-gradient(135deg, #667eea, #764ba2);
      }

      #fullscreenBtn:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      }

      #clearQueueBtn {
        background: linear-gradient(135deg, #dc3545, #c82333);
      }

      #clearQueueBtn:hover {
        transform: scale(1.05);
        box-shadow: 0 10px 30px rgba(220, 53, 69, 0.4);
      }

      /* QR Code Bottom Right */
      #qrcode-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        width: 166px;
        background: rgba(255, 255, 255, 0.95);
        padding: 10px;
        border-radius: 15px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        z-index: 100;
        text-align: center;
        font-size: 0.75rem;
        font-weight: 600;
        color: #666;
      }

      #qrcode {
        display: grid;
        width: 110px;
        height: 110px;
        flex: 0 0 110px;
        place-items: center;
      }

      #qrcode canvas,
      #qrcode img {
        display: block;
        width: 110px !important;
        height: 110px !important;
      }

      #roomCodeLabel {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #roomIdLabel {
        width: 100%;
        color: #111;
        font-size: 1rem;
        font-weight: 700;
        white-space: nowrap;
      }

      /* Center Singer Name */
      .center-singer-name {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 15;
        text-align: center;
        font-size: 3rem;
        font-weight: 900;
        color: white;
        text-shadow: 3px 3px 15px rgba(0, 0, 0, 0.7);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .center-singer-name.show {
        opacity: 1;
      }

      /* Responsive */
      @media (max-width: 1024px) {
        .tv-container {
          padding: 20px;
        }

        #nextSongDisplay {
          top: 15px;
          left: 15px;
          min-width: 250px;
          font-size: 0.9rem;
        }

        .button-group {
          top: 15px;
          right: 15px;
          gap: 8px;
        }

        .button-group button {
          padding: 10px 16px;
          font-size: 0.9rem;
        }
      }

      @media (max-width: 768px) {
        #nextSongDisplay {
          min-width: 200px;
          font-size: 0.8rem;
          padding: 8px 12px;
        }

        .button-group {
          gap: 6px;
        }

        .button-group button {
          padding: 8px 12px;
          font-size: 0.8rem;
        }

        .center-singer-name {
          font-size: 2rem;
        }
      }

      @media (max-width: 768px) and (orientation: portrait) {
        .tv-container {
          padding: 12px;
        }

        .button-group {
          top: 12px;
          right: 12px;
          left: 12px;
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
          gap: 8px;
        }

        .active-room-display {
          grid-column: 1 / -1;
          width: 100%;
          min-width: 0;
          box-sizing: border-box;
        }

        .button-group button {
          width: 100%;
          min-width: 0;
          min-height: 44px;
          padding: 8px;
          font-size: 0.8rem;
          white-space: nowrap;
        }

        #nextSongDisplay {
          top: 116px;
          right: 12px;
          left: 12px;
          width: auto;
          min-width: 0;
          box-sizing: border-box;
        }
      }

      /* Connection Status (Bottom Left) */
      #connectionStatus {
        position: fixed;
        bottom: 30px;
        left: 30px;
        background: rgba(30, 30, 50, 0.85);
        backdrop-filter: blur(6px);
        padding: 12px 20px;
        border-radius: 20px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 1rem;
        min-width: 180px;
      }

      #connectionStatus.connected {
        color: #22c55e;
      }

      #connectionStatus.disconnected {
        color: #ef4444;
      }

      @media (max-width: 768px) and (orientation: portrait) {
        #qrcode-container {
          right: 12px;
          bottom: 12px;
          width: 146px;
          min-height: 182px;
          justify-content: space-between;
        }

        #qrcode {
          width: 90px;
          height: 90px;
          flex-basis: 90px;
        }

        #qrcode canvas,
        #qrcode img {
          width: 90px !important;
          height: 90px !important;
        }

        #connectionStatus {
          right: auto;
          bottom: 31px;
          left: 12px;
          width: max-content;
          max-width: calc(100vw - 182px);
          min-width: 0;
          box-sizing: border-box;
          justify-content: flex-start;
          padding: 8px 6px;
          font-size: 0.7rem;
          line-height: 1.2;
          text-align: left;
          white-space: normal;
          transform: translateY(50%);
        }
      }

      #connectionStatus .status-indicator {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      #connectionStatus.connected .status-indicator {
        background: #22c55e;
        box-shadow: 0 0 10px #22c55e;
      }

      #connectionStatus.disconnected .status-indicator {
        background: #ef4444;
        animation: none;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
      }

      /* Boot-up Splash Screen */
      #bootupSplash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          #0f0f1e 0%,
          #1a0a2e 50%,
          #0f0f1e 100%
        );
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.8s ease-out;
      }

      #bootupSplash.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .bootup-container {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
      }

      .bootup-logo {
        font-size: 120px;
        animation: bootup-pulse 1.5s ease-in-out infinite;
      }

      @keyframes bootup-pulse {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 1;
        }
        50% {
          transform: scale(1.15) rotate(5deg);
          opacity: 0.8;
        }
      }

      .bootup-text {
        font-size: 32px;
        font-weight: 700;
        color: white;
        letter-spacing: 3px;
        animation: bootup-fade 1s ease-in-out 1s both;
      }

      @keyframes bootup-fade {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .bootup-subtitle {
        font-size: 18px;
        color: #a0a0c0;
        letter-spacing: 2px;
        animation: bootup-fade 1s ease-in-out 1.5s both;
      }

      .bootup-loading {
        display: flex;
        gap: 8px;
        justify-content: center;
        animation: bootup-fade 1s ease-in-out 2s both;
      }

      .bootup-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, #667eea, #764ba2);
        animation: bootup-bounce 1.4s ease-in-out infinite;
      }

      .bootup-dot:nth-child(2) {
        animation-delay: 0.2s;
      }

      .bootup-dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bootup-bounce {
        0%,
        100% {
          transform: translateY(0);
          opacity: 0.6;
        }
        50% {
          transform: translateY(-20px);
          opacity: 1;
        }
      }

      .bootup-status {
        font-size: 14px;
        color: #22c55e;
        animation: bootup-fade 1s ease-in-out 2.5s both;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .bootup-status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        animation: bootup-pulse 1s ease-in-out infinite;
      }
    </style>
  </head>

  <body class="tv-page">
    <!-- Boot-up Splash Screen -->
    <div id="bootupSplash">
      <div class="bootup-container">
        <div class="bootup-logo">🎤</div>
        <div class="bootup-text">SDkaraoke</div>
        <div class="bootup-subtitle">TV DISPLAY</div>
        <div class="bootup-loading">
          <div class="bootup-dot"></div>
          <div class="bootup-dot"></div>
          <div class="bootup-dot"></div>
        </div>
        <div class="bootup-status">
          <div class="bootup-status-dot"></div>
          <span>Initializing...</span>
        </div>
      </div>
    </div>

    <!-- Disable Message Splash Screen -->
    <div
      id="splashScreen"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 9999;
        display: none;
      "
    ></div>

    <div class="tv-container">
      <!-- Video Player -->
      <div class="now-playing-section">
        <div class="now-playing-card">
          <div id="videoPlayer"></div>
          <div id="noSongMessage" role="status" aria-live="polite">
            <strong>No song playing</strong>
            <span>Scan the QR code to request a song.</span>
          </div>
          <div id="centerSingerName" class="center-singer-name"></div>
        </div>
      </div>

      <!-- Next Song Display (Top Left) -->
      <div id="nextSongDisplay">
        <span>Next:</span>
        <span id="nextSongTitle">Waiting for next song...</span>
        <span id="nextSongArtist">-</span>
      </div>

      <!-- Buttons (Top Right) -->
      <div class="button-group">
        <div class="active-room-display" aria-live="polite">
          <span>TV connected to</span>
          <strong id="activeRoomName">Loading room...</strong>
          <small id="activeRoomCode"></small>
        </div>
        <button id="fullscreenBtn" onclick="toggleFullscreen()">
          ⛶ Full Screen
        </button>
        <button id="clearQueueBtn" onclick="deleteQueue()">
          🗑️ Clear Queue
        </button>
      </div>

      <button
        id="exitFullscreenBtn"
        type="button"
        onclick="toggleFullscreen()"
        hidden
      >
        Exit Full Screen
      </button>

      <!-- Footer Text -->
      <div id="connectionStatus" class="disconnected">
        <span id="connectionText">Maintained by Shan Denver</span>
      </div>

      <!-- QR Code -->
      <div id="qrcode-container">
        <div id="qrcode"></div>
        <div id="roomCodeLabel">Scan to Join Room</div>
        <div id="roomIdLabel"></div>
        <div id="roomMemberCount">0 / 3 phones</div>
      </div>
    </div>

    <script src="tv-display.js"></script>
    <script
      async
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"
    ></script>
  </body>
</html>
