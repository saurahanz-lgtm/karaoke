<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Reset Password | SD Karaoke</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: "DM Sans", sans-serif;
        background: #10151b;
        color: #f4f6f8;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            ellipse at 15% 15%,
            rgba(18, 132, 124, 0.2),
            transparent 38%
          ),
          #10151b;
      }

      main {
        width: min(100%, 440px);
        padding: 32px;
        border: 1px solid #34434b;
        border-radius: 8px;
        background: #182129;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
      }

      .brand {
        margin-bottom: 28px;
        color: #8ce0cf;
        font:
          700 14px "Space Grotesk",
          sans-serif;
      }

      h1 {
        margin: 0 0 8px;
        font:
          600 27px "Space Grotesk",
          sans-serif;
      }

      p {
        color: #b8c4ca;
        line-height: 1.55;
      }

      label {
        display: block;
        margin: 18px 0 7px;
        font-weight: 600;
      }

      input {
        width: 100%;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid #50616a;
        border-radius: 6px;
        background: #10171d;
        color: #f4f6f8;
        font: inherit;
      }

      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 2px solid #8ce0cf;
        outline-offset: 2px;
      }

      button,
      .back-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        margin-top: 20px;
        padding: 10px 16px;
        border: 0;
        border-radius: 6px;
        background: #16877a;
        color: white;
        font:
          600 15px "DM Sans",
          sans-serif;
        text-decoration: none;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      [role="status"] {
        min-height: 24px;
        margin-bottom: 0;
      }

      .error {
        color: #ffaaa3;
      }

      @media (max-width: 480px) {
        main {
          padding: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">SD KARAOKE / ACCOUNT SECURITY</div>
      <section id="loadingState" aria-live="polite">
        <h1>Checking your reset link</h1>
        <p>Please wait while we verify it.</p>
      </section>
      <section id="formState" hidden>
        <h1>Choose a new password</h1>
        <p>Set a new password for <strong id="accountEmail"></strong>.</p>
        <form id="resetPasswordForm">
          <label for="newPassword">New password</label>
          <input
            id="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          />
          <label for="confirmPassword">Confirm new password</label>
          <input
            id="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="6"
            required
          />
          <p id="formMessage" role="status" aria-live="polite"></p>
          <button id="submitButton" type="submit">Update password</button>
        </form>
      </section>
      <section id="successState" hidden>
        <h1>Password updated</h1>
        <p>
          Your password has been changed. You can now sign in to SD Karaoke.
        </p>
        <a class="back-link" href="index.html">Back to sign in</a>
      </section>
      <section id="errorState" hidden>
        <h1>Reset link unavailable</h1>
        <p id="errorMessage" class="error" role="alert"></p>
        <a class="back-link" href="index.html">Return to sign in</a>
      </section>
    </main>
    <script>
      const parameters = new URLSearchParams(window.location.search);
      const actionCode = parameters.get("oobCode");
      const loadingState = document.getElementById("loadingState");
      const formState = document.getElementById("formState");
      const successState = document.getElementById("successState");
      const errorState = document.getElementById("errorState");
      const formMessage = document.getElementById("formMessage");
      const submitButton = document.getElementById("submitButton");

      function showError(message) {
        loadingState.hidden = true;
        formState.hidden = true;
        errorState.hidden = false;
        document.getElementById("errorMessage").textContent = message;
      }

      if (parameters.get("mode") !== "resetPassword" || !actionCode) {
        showError("This password reset link is incomplete or invalid.");
      } else {
        firebase
          .auth()
          .verifyPasswordResetCode(actionCode)
          .then((email) => {
            loadingState.hidden = true;
            formState.hidden = false;
            document.getElementById("accountEmail").textContent = email;
            document.getElementById("newPassword").focus();
          })
          .catch(() => {
            showError(
              "This link may have expired or already been used. Request another password reset link.",
            );
          });
      }

      document
        .getElementById("resetPasswordForm")
        .addEventListener("submit", async (event) => {
          event.preventDefault();
          const password = document.getElementById("newPassword").value;
          const confirmation = document.getElementById("confirmPassword").value;
          if (password.length < 6) {
            formMessage.textContent = "Use at least 6 characters.";
            return;
          }
          if (password !== confirmation) {
            formMessage.textContent = "The passwords do not match.";
            return;
          }

          submitButton.disabled = true;
          formMessage.textContent = "Updating password...";
          try {
            await firebase.auth().confirmPasswordReset(actionCode, password);
            formState.hidden = true;
            successState.hidden = false;
          } catch (error) {
            formMessage.textContent =
              error.code === "auth/weak-password"
                ? "Choose a stronger password and try again."
                : "This link may have expired or already been used. Request another reset link.";
            submitButton.disabled = false;
          }
        });
    </script>
  </body>
</html>
