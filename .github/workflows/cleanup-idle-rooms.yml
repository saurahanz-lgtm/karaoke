name: Clean up idle karaoke queues

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger idle room cleanup
        run: |
          ID_TOKEN="$(curl --fail-with-body --silent --show-error --get \
            --data-urlencode "audience=sd-karaoke-queue-cleanup" \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -er '.value')"
          echo "::add-mask::$ID_TOKEN"
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 5 \
            --request GET \
            --header "Authorization: Bearer $ID_TOKEN" \
            https://sdkaraoke.vercel.app/api/cleanup-idle-rooms
